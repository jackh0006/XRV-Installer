name: Bug report
description: Report a reproducible installer defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include** tunnel keys, private keys, recovery phrases, live
        credentials, `client_config.json`, or `server_config.json`.
        Redact domains and IP addresses if they are private.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - xrv-install.sh (server)
        - xrv-client.sh (Linux)
        - xrv-client.sh (Termux)
        - Certificate management
        - GitHub workflow / release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands using throwaway data and a test domain/VPS.
      placeholder: |
        1. sudo bash xrv-install.sh ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.0 / 9a61bbb
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 amd64 / Termux arm64 / Debian 12 arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data. `--check --json` is helpful.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed all secrets and private config from this report.
          required: true
        - label: I ran the latest release, or the commit is stated above.
          required: true
