name: Release XRV

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck haproxy python3
          shellcheck -S warning -x xrv-install.sh xrv-client.sh tests/*.sh
          bash -n xrv-install.sh
          bash -n xrv-client.sh

      - name: Run tests
        env:
          HAPROXY_BIN: /usr/sbin/haproxy
        run: bash tests/run-all.sh

      - name: Generate checksums
        run: |
          sha256sum xrv-install.sh xrv-client.sh README.md CHANGELOG.md \
            RELEASE_NOTES_v1.1.0.md LICENSE SECURITY.md CONTRIBUTING.md \
            CODE_OF_CONDUCT.md docs/ARCHITECTURE.md docs/TROUBLESHOOTING.md \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xrv-install.sh
            xrv-client.sh
            SHA256SUMS.txt
            README.md
            CHANGELOG.md
            RELEASE_NOTES_v1.1.0.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            docs/ARCHITECTURE.md
            docs/TROUBLESHOOTING.md
          generate_release_notes: true
          draft: false
          prerelease: false
