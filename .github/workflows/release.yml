name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck haproxy python3
          shellcheck -S warning -x xrv-install.sh xrv-client.sh tests/*.sh
          bash -n xrv-install.sh
          bash -n xrv-client.sh

      - name: Run the full test suite
        env:
          HAPROXY_BIN: /usr/sbin/haproxy
        run: bash tests/run-all.sh

      - name: Generate checksums
        run: |
          sha256sum xrv-install.sh xrv-client.sh README.md CHANGELOG.md \
            RELEASE_NOTES_v1.1.1.md DONATE.md SUPPORT.md LICENSE SECURITY.md \
            CONTRIBUTING.md CODE_OF_CONDUCT.md docs/ARCHITECTURE.md docs/TROUBLESHOOTING.md docs/USER-GUIDE.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            xrv-install.sh
            xrv-client.sh
            SHA256SUMS.txt
            README.md
            CHANGELOG.md
            RELEASE_NOTES_v1.1.1.md
            DONATE.md
            SUPPORT.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            docs/ARCHITECTURE.md
            docs/TROUBLESHOOTING.md
            docs/USER-GUIDE.md
          generate_release_notes: true
          draft: false
          prerelease: false
