name: Test XRV Installer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every shell file
        run: |
          bash -n xrv-install.sh
          bash -n xrv-client.sh
          for f in tests/*.sh; do bash -n "$f"; done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run ShellCheck
        run: shellcheck -S warning -x xrv-install.sh xrv-client.sh tests/*.sh

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq haproxy python3 curl openssl shellcheck
      - name: Run the suite
        env:
          HAPROXY_BIN: /usr/sbin/haproxy
        run: bash tests/run-all.sh
