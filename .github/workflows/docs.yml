name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'xrv-install.sh'
      - 'xrv-client.sh'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build help pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Markdown converter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Generate server help page
        run: |
          mkdir -p docs
          {
            echo '# Server help'
            echo
            echo '```text'
            bash xrv-install.sh --help
            echo '```'
          } > docs/usage.md
      - name: Generate client help page
        run: |
          {
            echo '# Client help'
            echo
            echo '```text'
            bash xrv-client.sh --help
            echo '```'
          } > docs/client-usage.md
      - name: Generate changelog page
        run: |
          {
            echo '# Commit history'
            echo
            git log --oneline --pretty=format:'- %s (%h)'
          } > docs/CHANGELOG.md || true
      - name: Render Markdown pages
        run: |
          for f in docs/*.md; do
            base="$(basename "$f" .md)"
            pandoc "$f" -s --css style.css --metadata title="XRV — $base" -o "docs/${base}.html"
          done
          touch docs/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./docs

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
