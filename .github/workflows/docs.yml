name: Build Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'xrv-install.sh'
      - 'xrv-client.sh'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Generate help pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract server help
        run: |
          mkdir -p docs
          {
            echo '# Server help'
            echo
            echo '```text'
            bash xrv-install.sh --help
            echo '```'
          } > docs/usage.md
      - name: Extract client help
        run: |
          {
            echo '# Client help'
            echo
            echo '```text'
            bash xrv-client.sh --help
            echo '```'
          } > docs/client-usage.md
      - name: Generate changelog page
        run: |
          git log --oneline --pretty=format:'- %s (%h)' > docs/CHANGELOG.md || true
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-docs:
    name: Deploy docs
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
